name: Prerelease APK
on:
  workflow_dispatch:
jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs -name "*.apk" -exec cp {} dist/ \;
          f=$(ls dist/*.apk | head -1)
          cp "$f" dist/Rahban-test.apk
          sha256sum dist/Rahban-test.apk | tee dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: آزمایشی راهبان #${{ github.run_number }}
          prerelease: true
          files: |
            dist/Rahban-test.apk
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
